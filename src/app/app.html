<app-header 
  (search)="onSearchCity($event)" 
  (geoClick)="onGeoClick()">
</app-header>

<main class="main-container">
  @if (errorMessage) {
    <div class="error-banner">
      <p>⚠️ {{ errorMessage }}</p>
      <span class="tip">Nota: Lembre-se de configurar sua API Key da OpenWeatherMap em `src/environments/environment.ts` se receber erro de chave inválida.</span>
    </div>
  }

  <app-current-weather [weatherData]="weatherData"></app-current-weather>

  <app-hourly-chart [forecastData]="forecastData"></app-hourly-chart>
</main>
